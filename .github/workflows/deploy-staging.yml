name: Deploy Supabase staging backend
on:
  workflow_dispatch:

concurrency:
  group: videoalbum-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: mvp
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_POOLER_HOST: ${{ vars.SUPABASE_DB_POOLER_HOST }}
      FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: mvp/package-lock.json
      - run: npm ci
      - name: Validate deployment configuration
        run: node scripts/preflight.mjs
      - run: npm test
      - run: npm run check
      - run: npm run deploy:backend
      - run: npm run smoke:staging
